name: 修复股票空价格数据

on:
  schedule:
    # 每小时兜底一次；错开整点减少 GitHub 排队延迟
    - cron: '37 * * * *'
  # 采集任务结束后立即跟随执行一次，保证修复总在采集之后
  workflow_run:
    workflows: ["采集股票价格数据"]
    types: [completed]
  workflow_dispatch:

jobs:
  repair-prices:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行价格修复
        env:
          APP_ENV: "prod"
          ENABLE_REMOTE_WRITE: "true"
          INGEST_API_BASE_URL: ${{ secrets.INGEST_API_BASE_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          LOG_LEVEL: "INFO"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py repair-prices
